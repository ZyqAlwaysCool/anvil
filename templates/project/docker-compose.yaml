# 扩容 worker: docker compose up --scale worker=2
#
# 配置分层说明：
# 1. env_file 加载 configs/.env.example —— 保守基线（TASK/REDIS/MONGO/LLM 默认关闭）
# 2. environment 覆盖 —— 仅在 compose 场景下启用完整任务链路
# 本地 make run 请直接使用 .env.example，不会自动启用任务系统。
#
# 本文件为 docker-compose 唯一维护点；仓库根目录 docker-compose.yaml 指向此处。

services:
  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/redis:7.0.14
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mongo:latest
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: .
    ports:
      - "28888:28888"
    env_file:
      - .env
    volumes:
      - ./deploy_docker/logs:/app/var/log/anvil
    environment:
      TASK_ENABLED: "true"
      REDIS_ENABLED: "true"
      MONGO_ENABLED: "true"
      REDIS_ADDRS: redis:6379
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  worker:
    build: .
    command: ["./worker"]  # 覆盖镜像默认 CMD ./server
    env_file:
      - .env
    volumes:
      - ./deploy_docker/logs:/app/var/log/anvil
    environment:
      TASK_ENABLED: "true"
      REDIS_ENABLED: "true"
      MONGO_ENABLED: "true"
      REDIS_ADDRS: redis:6379
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
